# ===========================================================================
# Secret — credenciales de base de datos.
# Los valores llegan desde values.local.yaml (no versionado).
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cotizaciones
  namespace: {{ .Release.Namespace }}
  labels:
    app: cotizaciones
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword requerido (values.local.yaml)" .Values.secrets.dbPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword requerido" .Values.secrets.mysqlRootPassword | quote }}
