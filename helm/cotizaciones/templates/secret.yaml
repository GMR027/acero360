# ===========================================================================
# Secret — credenciales de base de datos y SMTP.
# Los valores llegan desde values.local.yaml (no versionado).
# ===========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: cotizaciones
  namespace: {{ .Release.Namespace }}
  labels:
    app: cotizaciones
type: Opaque
stringData:
  DB_PASSWORD: {{ required "secrets.dbPassword requerido (values.local.yaml)" .Values.secrets.dbPassword | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword requerido" .Values.secrets.mysqlRootPassword | quote }}
  SMTP_HOST: {{ .Values.correo.host | quote }}
  SMTP_PORT: {{ .Values.correo.port | quote }}
  SMTP_SEGURO: {{ .Values.correo.seguro | quote }}
  SMTP_USUARIO: {{ .Values.correo.usuario | quote }}
  SMTP_PASS: {{ .Values.correo.password | quote }}
  SMTP_DESDE: {{ .Values.correo.desde | quote }}
  SMTP_DESDE_NOMBRE: {{ .Values.correo.desdeNombre | quote }}
