# ===========================================================================
# Service MySQL — el app lo alcanza como host "mysql" (mismo namespace).
# ===========================================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Release.Namespace }}
  labels:
    app: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
