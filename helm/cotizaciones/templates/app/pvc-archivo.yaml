# ===========================================================================
# PVC para storage/archivo — archivos de la herramienta «Archivo» (Word,
# Excel, PDF, planos, modelos…). Antes vivían sólo en la capa del contenedor y
# se perdían al reiniciar; ahora persisten y entran en el respaldo diario.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cotizaciones-archivo
  namespace: {{ .Release.Namespace }}
  labels:
    app: cotizaciones
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: {{ .Values.persistence.archivo.size }}
