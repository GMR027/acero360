# ===========================================================================
# PVC para los respaldos — el respaldo se hace DENTRO del clúster y vive aquí.
#
# Lo comparten la app (Ajustes → Almacenamiento: hacer, descargar, subir y
# restaurar copias) y el CronJob diario. Siempre se crea, aunque el CronJob
# esté desactivado: sin este volumen las copias se perderían al reiniciar el pod.
#
# En MicroK8s usa el mismo storageClassName que el resto (microk8s-hostpath).
# El volumen es ReadWriteOnce: por eso el CronJob y la app conviven en el mismo
# nodo; no lo montes en varios nodos a la vez.
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cotizaciones-respaldos
  namespace: {{ .Release.Namespace }}
  labels:
    app: cotizaciones
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: {{ .Values.respaldo.size }}
