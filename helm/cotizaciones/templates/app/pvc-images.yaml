# ===========================================================================
# PVC para public/image — fotos de productos, perfiles y logos.
# Persiste entre upgrades; el initContainer del Deployment lo precarga
# con las imágenes del repo la primera vez (sólo si está vacío).
# ===========================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cotizaciones-images
  namespace: {{ .Release.Namespace }}
  labels:
    app: cotizaciones
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: {{ .Values.persistence.images.size }}
