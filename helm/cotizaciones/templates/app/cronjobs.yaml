# ===========================================================================
# Tareas programadas (el respaldo viene ACTIVADO; la foto de inventario, no).
#   fotoInventario.enabled  → fotografía del inventario el día 1 de cada mes (mes anterior). No modifica existencias.
#   respaldo.enabled        → respaldo diario COMPLETO (base + archivos) ejecutado DENTRO del clúster.
#
# El respaldo corre con la MISMA imagen de la app (ya trae mysqldump/mysql, tar,
# gzip y los scripts/respaldar.sh) y monta los mismos PVC que la app. La copia
# queda en el PVC cotizaciones-respaldos, que también monta la app en
# /var/www/html/respaldos: desde Ajustes → Almacenamiento se puede descargar o
# restaurar, sin depender de un equipo con kubectl.
# ===========================================================================
{{- if .Values.fotoInventario.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cotizaciones-foto-inventario
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.fotoInventario.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: foto
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["php", "scripts/foto_inventario.php"]
              env:
                - { name: DB_HOST, value: mysql }
                - { name: DB_NAME, value: {{ .Values.mysql.database | quote }} }
                - { name: DB_USER, value: {{ .Values.mysql.user | quote }} }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: cotizaciones, key: DB_PASSWORD } }
{{- end }}
{{- if .Values.respaldo.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cotizaciones-respaldo
  namespace: {{ .Release.Namespace }}
  labels:
    app: cotizaciones
spec:
  schedule: {{ .Values.respaldo.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # La app (Apache/PHP) escribe como www-data (33): el CronJob debe dejar
          # las copias con el mismo dueño para poder descargarlas y restaurarlas.
          securityContext:
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
          containers:
            - name: respaldo
              image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # El script detecta la raíz, empaqueta la base y TODAS las carpetas
              # persistentes, calcula las huellas y aplica la retención.
              command: ["bash", "/var/www/html/scripts/respaldar.sh", "/var/www/html/respaldos"]
              env:
                - { name: DB_HOST, value: mysql }
                - { name: DB_NAME, value: {{ .Values.mysql.database | quote }} }
                - { name: DB_USER, value: {{ .Values.mysql.user | quote }} }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: cotizaciones, key: DB_PASSWORD } }
                # Sin RETENER: el script lee «respaldo_retener» de la configuración
                # (Ajustes → Almacenamiento), igual que el respaldo manual.
                # Marca el manifiesto: la app no duplica el respaldo del día si ya lo hizo el CronJob.
                - { name: RESPALDO_ORIGEN, value: "cron" }
                # Rutas relativas a la raíz de la app (donde están montados los PVC).
                - { name: ARCHIVOS_DIRS, value: "public/image public/uploads storage/documentos storage/archivo" }
              volumeMounts:
                - { name: images, mountPath: /var/www/html/public/image }
                - { name: uploads, mountPath: /var/www/html/public/uploads }
                - { name: documentos, mountPath: /var/www/html/storage/documentos }
                - { name: archivo, mountPath: /var/www/html/storage/archivo }
                - { name: respaldos, mountPath: /var/www/html/respaldos }
          volumes:
            - name: images
              persistentVolumeClaim: { claimName: cotizaciones-images }
            - name: uploads
              persistentVolumeClaim: { claimName: cotizaciones-uploads }
            - name: documentos
              persistentVolumeClaim: { claimName: cotizaciones-documentos }
            - name: archivo
              persistentVolumeClaim: { claimName: cotizaciones-archivo }
            - name: respaldos
              persistentVolumeClaim: { claimName: cotizaciones-respaldos }
{{- end }}
