# ===========================================================================
# values.yaml — valores por defecto del chart cotizaciones
#
# Los secretos reales (contraseñas DB y SMTP) van en values.local.yaml,
# archivo que NO se sube a git (ver .gitignore). Deploy:
#
#   helm upgrade --install cotizaciones ./helm/cotizaciones \
#     -n cotizaciones -f values.yaml -f values.local.yaml
# ===========================================================================

replicaCount: 1

image:
  repository: gmr27/cotizaciones
  tag: "1"               # el script deploy.sh lo sobrescribe con --set
  pullPolicy: IfNotPresent

app:
  host: cotizaciones.iguzman.com.mx
  # 1 = registro abierto; 0 = sólo admins dan de alta usuarios
  registroAbierto: "0"

mysql:
  image: mysql:8
  database: cotizaciones
  user: cotizaciones
  storage: 2Gi

# Credenciales — SOBRESCRIBIR en values.local.yaml
secrets:
  dbPassword: CAMBIAR-EN-VALUES-LOCAL
  mysqlRootPassword: CAMBIAR-EN-VALUES-LOCAL

persistence:
  images:
    size: 1Gi            # public/image (fotos de productos, perfiles, logos)
  uploads:
    size: 1Gi            # public/uploads (planos, firmas, sellos y miniaturas de herramientas)
  documentos:
    size: 5Gi            # storage/documentos (comprobantes fiscales: PDF, imágenes y XML)

resources:
  app:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  mysql:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

ingress:
  className: public
  clusterIssuer: letsencrypt-prod
  proxyBodySize: 20m

# Tareas programadas (plantillas desactivadas por defecto; ver templates/app/cronjobs.yaml)
fotoInventario:
  enabled: false
  schedule: "10 0 1 * *"     # día 1 de cada mes, 00:10: fotografía del inventario del mes anterior

respaldo:
  enabled: false
  schedule: "30 2 * * *"     # diario 02:30
  retener: 14                # copias a conservar
  size: 2Gi
